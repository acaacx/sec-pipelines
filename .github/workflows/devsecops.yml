# =============================================================================
# DevSecOps Pipeline — GitHub Actions wrapper.
#
# The security LOGIC lives in ./scripts (invoked via `make`), shared verbatim
# with .gitlab-ci.yml and the Jenkinsfile. This file only orchestrates: job
# graph, GHA-native OIDC login, and SARIF upload to the Security tab.
#
# Fail-fast: Stage-1 gates run in parallel; `needs:` blocks every downstream
# stage until all gates are green. Each `make` target exits non-zero on a
# threshold breach.
# =============================================================================
name: DevSecOps Pipeline

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: eu-west-1
  ECR_REPOSITORY: devsecops-demo
  ACR_NAME: devsecopsdemoacr
  IMAGE_TAG: ${{ github.sha }}

jobs:
  # ===========================================================================
  # STAGE 1 — SECURITY GATES (parallel, fail-fast)
  # ===========================================================================
  secrets-scan:
    name: "Gate: Secrets (Gitleaks)"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: make install
      - run: make scan-secrets

  iac-scan:
    name: "Gate: IaC (Checkov)"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: make install
      - run: make scan-iac
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: results_sarif.sarif
          category: checkov-iac

  sast-python:
    name: "Gate: SAST Python"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: make install
      - run: make sast-python
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-python.sarif
          category: semgrep-python

  sast-java:
    name: "Gate: SAST Java"
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - run: make install
      - run: make sast-java
      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-java.sarif
          category: semgrep-java

  sca-python:
    name: "Gate: SCA Python"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app-python/requirements.txt
      - run: make install
      - run: make sca-python

  sca-java:
    name: "Gate: SCA Java"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.dependency-check-data
          key: nvd-db-${{ github.run_id }}
          restore-keys: nvd-db-
      - name: SCA (Java)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: make sca-java
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: app-java/target/dependency-check-report.*

  # ===========================================================================
  # STAGE 2 — BUILD + IMAGE SCAN + PUSH  (blocked by all Stage-1 gates)
  # ===========================================================================
  build-scan-push:
    name: "Build & Scan: ${{ matrix.app }}"
    runs-on: ubuntu-latest
    needs: [secrets-scan, iac-scan, sast-python, sast-java, sca-python, sca-java]
    permissions:
      contents: read
      id-token: write
      security-events: write
    strategy:
      fail-fast: true
      matrix:
        app: [app-python, app-java]
    steps:
      - uses: actions/checkout@v4
      - run: make install

      # Build (local) + Trivy gate — blocks push on HIGH/CRITICAL.
      - name: Build + scan image
        run: make build-scan APP=${{ matrix.app }}

      - uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-${{ matrix.app }}.sarif
          category: trivy-${{ matrix.app }}

      # Push only on main, only after the scan passed. OIDC — no stored keys.
      - name: Configure AWS credentials (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Azure login (OIDC)
        if: github.ref == 'refs/heads/main'
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Tag & push to ECR + ACR
        if: github.ref == 'refs/heads/main'
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          ref="${{ matrix.app }}:${{ env.IMAGE_TAG }}"
          scripts/push-image.sh ${{ matrix.app }} "$ref"

  # ===========================================================================
  # STAGE 3 — DEPLOY  (OIDC, staging -> production)
  # ===========================================================================
  deploy-staging:
    name: "Deploy: Staging"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: build-scan-push
    environment: staging
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_STAGING_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy staging
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: make deploy-staging

  deploy-production:
    name: "Deploy: Production"
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: deploy-staging
    environment: production        # required reviewers => manual approval gate
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_PRODUCTION_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy production
        env:
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: make deploy-production
